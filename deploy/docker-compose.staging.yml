name: contact-thermography-ai-staging

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-lct}"
      POSTGRES_USER: "${POSTGRES_USER:-lct}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  lct:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      APP_ENV: staging
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: "${POSTGRES_DB:-lct}"
      DB_USER: "${POSTGRES_USER:-lct}"
      DB_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
      STORAGE_BACKEND: filesystem
      STORAGE_ROOT: /var/lib/lct/storage
    volumes:
      - media_data:/var/lib/lct/storage
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped

  proxy:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?APP_DOMAIN is required}"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      lct:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
    name: contact-thermography-ai-staging-postgres
  media_data:
    name: contact-thermography-ai-staging-media
  caddy_data:
    name: contact-thermography-ai-staging-caddy-data
  caddy_config:
    name: contact-thermography-ai-staging-caddy-config
