name: QA hardening regression

on:
  pull_request:
    branches: [integration, main]
  push:
    branches: [integration, main]

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application and test dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt 'pillow>=10'
      - name: Install production-equivalent CPU vision runtime
        run: >-
          pip install --index-url https://download.pytorch.org/whl/cpu
          'torch==2.14.0+cpu' 'torchvision==0.29.0+cpu'
      - name: Run regression and hardening suite
        run: pytest -q
